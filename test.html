<!DOCTYPE html>
<html>
<body>

<h2>Test Repose API</h2>

<input id="prompt" value="a cinematic portrait of a person">
<button onclick="generate()">Generate</button>

<div id="message" style="color:#c00; white-space:pre-wrap;"></div>

<br>

<img id="result" style="max-width:500px; display:block; margin-top:16px;">

<script>
async function generate() {

    const message = document.getElementById("message");
    const result = document.getElementById("result");
    message.textContent = "Sending request...";
    result.src = "";

    const formData = new FormData();
    formData.append(
        "prompt",
        document.getElementById("prompt").value
    );

    try {
        const response = await fetch(
            "https://repose.dhilip-cud99.workers.dev/api/generate-pose",
            {
                method: "POST",
                body: formData
            }
        );

        const text = await response.text();
        let data;

        try {
            data = JSON.parse(text);
        } catch (jsonError) {
            data = null;
        }

        if (!response.ok) {
            message.textContent =
                `HTTP ${response.status}: ${data?.message || data?.error || text}`;
            console.error("Response error:", text);
            return;
        }

        if (!data) {
            message.textContent = "Received invalid JSON from the API.";
            console.error("Invalid JSON:", text);
            return;
        }

        if (data.imageUrl) {
            result.src = data.imageUrl;
            message.textContent = "Image generated successfully.";
        } else {
            message.textContent = data.message || "No imageUrl returned.";
        }

    } catch (error) {
        message.textContent =
            "Request failed: " + (error.message || error);
        console.error(error);
    }
}
</script>

</body>
</html>
